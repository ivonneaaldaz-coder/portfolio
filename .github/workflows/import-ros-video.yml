name: Import Relationship OS video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ros-video.yml"

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: "https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-7e68-820c-b2df-1e4bf4db1177/raw?se=2026-10-06T23%3A02%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=39cd9191-ad4a-59d8-bbb5-f5232eabfb42&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T11%3A58%3A56Z&ske=2026-10-07T11%3A58%3A56Z&sks=b&skv=2026-02-06&sig=ck1f6TeN/4K8MoJpRF1AeekZTJvpG0QqtI6DX18xps4%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download video
        run: |
          mkdir -p public/case-studies
          curl -fL "$VIDEO_URL" -o public/case-studies/relationship-operating-system.mp4
          test -s public/case-studies/relationship-operating-system.mp4
      - name: Commit video and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/import-ros-video.yml
          git add public/case-studies/relationship-operating-system.mp4 .github/workflows/import-ros-video.yml
          git commit -m "Host Relationship Operating System video"
          git push origin HEAD:main
